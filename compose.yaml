services:
  omr:
    build:
      context: ./omr-service
    environment:
      OMR_SERVICE_TOKEN: ${OMR_SERVICE_TOKEN:-local-omr-secret}
      OMR_TIMEOUT_SECONDS: ${OMR_TIMEOUT_SECONDS:-270}
      OMR_MUSIC_FONT: ${OMR_MUSIC_FONT:-Leland}
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
